<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Genie · Predictor</title>
<style>
  :root {
    --bg:        #07070f;
    --card:      #0f0f1b;
    --card2:     #13131f;
    --border:    rgba(255,255,255,0.07);
    --border2:   rgba(255,255,255,0.12);
    --text:      #e8e8f4;
    --muted:     #5a5a7a;
    --bull:      #00d084;
    --bear:      #ff4466;
    --neutral:   #ffa726;
    --accent:    #7c6fff;
    --up:        #00d084;
    --dn:        #ff4466;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Search View ────────────────────────────────── */
  #searchView {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    position: relative;
    transition: opacity 0.3s ease;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .brand-gem {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .brand-name {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .search-headline {
    font-size: clamp(28px, 6vw, 48px);
    font-weight: 700;
    letter-spacing: -0.02em;
    text-align: center;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #fff 60%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .search-sub {
    font-size: 15px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 40px;
  }
  .search-box {
    display: flex;
    align-items: center;
    background: var(--card);
    border: 1.5px solid var(--border2);
    border-radius: 16px;
    width: 100%;
    max-width: 480px;
    padding: 6px 6px 6px 22px;
    gap: 10px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,111,255,0.15);
  }
  #tickerInput {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    width: 100%;
  }
  #tickerInput::placeholder {
    color: var(--muted);
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
    font-size: 16px;
  }
  #searchBtn {
    background: var(--accent);
    border: none;
    border-radius: 10px;
    width: 48px; height: 48px;
    cursor: pointer;
    color: #fff;
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.1s;
    flex-shrink: 0;
  }
  #searchBtn:hover { background: #6a5fe8; }
  #searchBtn:active { transform: scale(0.95); }
  .search-hint {
    margin-top: 20px;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .search-hint span {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .search-hint span:hover { border-color: var(--accent); color: var(--text); }
  #searchError {
    margin-top: 12px;
    color: var(--bear);
    font-size: 14px;
    display: none;
  }

  /* ── Results View ───────────────────────────────── */
  #resultsView {
    display: none;
    padding: 0 0 60px;
    animation: fadeIn 0.35s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  /* Top bar */
  .top-bar {
    display: flex;
    align-items: center;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    gap: 16px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    background: rgba(7,7,15,0.92);
    backdrop-filter: blur(12px);
    z-index: 10;
  }
  #backBtn {
    background: none;
    border: 1px solid var(--border2);
    border-radius: 8px;
    color: var(--muted);
    padding: 7px 14px;
    cursor: pointer;
    font-size: 13px;
    transition: color 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  #backBtn:hover { color: var(--text); border-color: var(--border2); }
  .stock-identity { flex: 1; min-width: 0; }
  .stock-ticker { font-size: 22px; font-weight: 800; letter-spacing: 0.04em; }
  .stock-name   { font-size: 13px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .price-block  { text-align: right; }
  .price-value  { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .price-chg    { font-size: 13px; margin-top: 1px; }
  .price-chg.up { color: var(--up); }
  .price-chg.dn { color: var(--dn); }

  /* Loading */
  #loadingBar {
    display: none;
    padding: 80px 24px;
    text-align: center;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { color: var(--muted); font-size: 14px; }

  /* Main layout */
  .results-body { max-width: 900px; margin: 0 auto; padding: 28px 20px 0; }

  /* Probability cards */
  .prob-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  /* ── Mobile overrides ──────────────────────────────── */
  @media (max-width: 620px) {
    /* Search view */
    #searchView { padding: 16px 14px; }
    .search-sub  { font-size: 12px; margin-bottom: 28px; }
    .search-box  { max-width: 100%; }
    .search-hint { gap: 10px; }

    /* Top bar — stay single row, shrink fonts */
    .top-bar {
      flex-wrap: nowrap;
      padding: 10px 14px;
      gap: 10px;
    }
    .stock-ticker { font-size: 17px; }
    .stock-name   { font-size: 11px; }
    .price-value  { font-size: 17px; }
    .price-chg    { font-size: 11px; }
    #backBtn      { padding: 5px 10px; font-size: 12px; }

    /* Results body */
    .results-body { padding: 16px 12px 0; }

    /* Probability grid — keep 3 cols but compact */
    .prob-grid {
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .prob-card { padding: 14px 8px 12px; border-radius: 12px; }
    .prob-timeframe { font-size: 10px; }

    /* Shrink SVG gauges */
    .gauge-wrap {
      width: 88px;
      height: 88px;
      margin: 4px 0 2px;
    }
    .gauge-wrap svg { width: 88px; height: 88px; }
    .gauge-pct   { font-size: 22px; }
    .gauge-label { font-size: 9px; letter-spacing: 0.06em; }

    /* Hide driver subtitle — saves vertical space */
    .prob-driver { display: none; }

    /* Signal factor rows */
    .section-card { padding: 14px 12px; border-radius: 12px; }
    .factor-label { width: 88px; font-size: 12px; }
    .factor-desc  { font-size: 12px; }
    .factor-icon  { width: 24px; height: 24px; font-size: 11px; }

    /* Metrics — 2 cols on mobile */
    .metrics-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .metric-value { font-size: 14px; }

    /* Company tags wrap fine already */
    .company-desc { font-size: 12px; }

    /* Confidence bars */
    .conf-label { width: 70px; font-size: 11px; }
  }
  .prob-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 16px 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .prob-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--card-accent, var(--accent));
    border-radius: 16px 16px 0 0;
  }
  .prob-timeframe {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* SVG gauge */
  .gauge-wrap { position: relative; width: 140px; height: 140px; margin: 8px 0 4px; }
  .gauge-bg   { fill: none; stroke: rgba(255,255,255,0.06); }
  .gauge-arc  { fill: none; stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(.4,0,.2,1), stroke 0.4s; }
  .gauge-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .gauge-pct   { font-size: 34px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .gauge-label { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; }
  .prob-driver { font-size: 12px; color: var(--muted); text-align: center; }

  /* Signal factors */
  .section-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 22px;
    margin-bottom: 16px;
  }
  .section-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .factor-list { display: flex; flex-direction: column; gap: 1px; }
  .factor-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
  }
  .factor-row:last-child { border-bottom: none; }
  .factor-icon {
    width: 28px; height: 28px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
  }
  .factor-icon.bull { background: rgba(0,208,132,0.12); }
  .factor-icon.bear { background: rgba(255,68,102,0.12); }
  .factor-icon.neut { background: rgba(255,167,38,0.12); }
  .factor-label { font-size: 13px; font-weight: 600; width: 130px; flex-shrink: 0; }
  .factor-desc  { font-size: 13px; color: var(--muted); flex: 1; }

  /* Key metrics */
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 12px;
  }
  .metric-item { }
  .metric-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  .metric-value { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* Company */
  .company-desc { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 12px; }
  .company-tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .ctag {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 6px;
    background: rgba(124,111,255,0.1);
    color: var(--accent);
    border: 1px solid rgba(124,111,255,0.2);
  }

  /* Confidence bar */
  .conf-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .conf-label { font-size: 12px; color: var(--muted); width: 90px; flex-shrink: 0; }
  .conf-bar-bg { flex: 1; height: 5px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
  .conf-bar-fill { height: 100%; border-radius: 4px; transition: width 1s ease; }
</style>
</head>
<body>

<!-- ═══════════ SEARCH VIEW ═══════════ -->
<div id="searchView">
  <a href="/" style="position:absolute;top:20px;left:24px;font-size:12px;color:var(--muted);
     text-decoration:none;display:flex;align-items:center;gap:5px;
     border:1px solid var(--border);border-radius:8px;padding:6px 12px;
     transition:color 0.15s,border-color 0.15s;"
     onmouseover="this.style.color='var(--text)';this.style.borderColor='var(--border2)'"
     onmouseout="this.style.color='var(--muted)';this.style.borderColor='var(--border)'">
    ← Dashboard
  </a>
  <div class="brand">
    <div class="brand-gem">◆</div>
    <span class="brand-name">Market Genie</span>
  </div>
  <h1 class="search-headline">Stock Predictor</h1>
  <p class="search-sub">Powered by Kronos AI · Technical Analysis · Social Intelligence</p>

  <div class="search-box">
    <input id="tickerInput" type="text" placeholder="Enter ticker symbol, e.g. AAPL" autocomplete="off" spellcheck="false" maxlength="10">
    <button id="searchBtn" title="Analyze">→</button>
  </div>
  <div id="searchError"></div>
  <div class="search-hint">
    <span onclick="runSearch('AAPL')">AAPL</span>
    <span onclick="runSearch('TSLA')">TSLA</span>
    <span onclick="runSearch('NVDA')">NVDA</span>
    <span onclick="runSearch('SPY')">SPY</span>
    <span onclick="runSearch('META')">META</span>
  </div>
</div>

<!-- ═══════════ RESULTS VIEW ═══════════ -->
<div id="resultsView">

  <!-- Sticky top bar -->
  <div class="top-bar">
    <button id="backBtn" onclick="showSearch()">← New Search</button>
    <div class="stock-identity">
      <div class="stock-ticker" id="rTicker">—</div>
      <div class="stock-name"  id="rName">—</div>
    </div>
    <div class="price-block">
      <div class="price-value" id="rPrice">—</div>
      <div class="price-chg"   id="rChg">—</div>
    </div>
  </div>

  <!-- Loading spinner (shown while fetching) -->
  <div id="loadingBar">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Analyzing…</div>
  </div>

  <!-- Results body -->
  <div class="results-body" id="resultsBody" style="display:none">

    <!-- Probability grid -->
    <div class="prob-grid">
      <div class="prob-card" id="cardDay">
        <div class="prob-timeframe">Today</div>
        <div class="gauge-wrap">
          <svg viewBox="0 0 140 140" style="width:100%;height:100%;display:block;">
            <circle class="gauge-bg"  cx="70" cy="70" r="54" stroke-width="10"/>
            <circle class="gauge-arc" cx="70" cy="70" r="54" stroke-width="10" id="arcDay"
                    stroke-dasharray="339.3" stroke-dashoffset="339.3"
                    transform="rotate(-90 70 70)" stroke="var(--accent)"/>
          </svg>
          <div class="gauge-center">
            <div class="gauge-pct"   id="pctDay">—</div>
            <div class="gauge-label" id="lblDay">—</div>
          </div>
        </div>
        <div class="prob-driver" id="drvDay"></div>
      </div>

      <div class="prob-card" id="cardWeek">
        <div class="prob-timeframe">This Week</div>
        <div class="gauge-wrap">
          <svg viewBox="0 0 140 140" style="width:100%;height:100%;display:block;">
            <circle class="gauge-bg"  cx="70" cy="70" r="54" stroke-width="10"/>
            <circle class="gauge-arc" cx="70" cy="70" r="54" stroke-width="10" id="arcWeek"
                    stroke-dasharray="339.3" stroke-dashoffset="339.3"
                    transform="rotate(-90 70 70)" stroke="var(--accent)"/>
          </svg>
          <div class="gauge-center">
            <div class="gauge-pct"   id="pctWeek">—</div>
            <div class="gauge-label" id="lblWeek">—</div>
          </div>
        </div>
        <div class="prob-driver" id="drvWeek"></div>
      </div>

      <div class="prob-card" id="cardMonth">
        <div class="prob-timeframe">This Month</div>
        <div class="gauge-wrap">
          <svg viewBox="0 0 140 140" style="width:100%;height:100%;display:block;">
            <circle class="gauge-bg"  cx="70" cy="70" r="54" stroke-width="10"/>
            <circle class="gauge-arc" cx="70" cy="70" r="54" stroke-width="10" id="arcMonth"
                    stroke-dasharray="339.3" stroke-dashoffset="339.3"
                    transform="rotate(-90 70 70)" stroke="var(--accent)"/>
          </svg>
          <div class="gauge-center">
            <div class="gauge-pct"   id="pctMonth">—</div>
            <div class="gauge-label" id="lblMonth">—</div>
          </div>
        </div>
        <div class="prob-driver" id="drvMonth"></div>
      </div>
    </div>

    <!-- Signal Factors -->
    <div class="section-card">
      <div class="section-title">Signal Breakdown</div>
      <div class="factor-list" id="factorList"></div>
    </div>

    <!-- Confidence bars -->
    <div class="section-card" id="confCard">
      <div class="section-title">Prediction Confidence</div>
      <div id="confBars"></div>
    </div>

    <!-- Key Metrics -->
    <div class="section-card">
      <div class="section-title">Key Metrics</div>
      <div class="metrics-grid" id="metricsGrid"></div>
    </div>

    <!-- Company -->
    <div class="section-card" id="companyCard" style="display:none">
      <div class="section-title">About</div>
      <p class="company-desc" id="companyDesc"></p>
      <div class="company-tags" id="companyTags"></div>
    </div>

  </div><!-- /results-body -->
</div><!-- /resultsView -->

<script>
// ── Server URL detection ──────────────────────────────────────────────────────
// Covers: Railway (https://...), localhost served by Flask, AND file:// double-click
const _h = window.location.hostname;
const _p = window.location.protocol;
const BASE = (_p === 'file:' || _h === '' || _h === 'localhost' || _h === '127.0.0.1')
  ? 'http://localhost:5000'
  : window.location.origin;

// ── Search logic ──────────────────────────────────────────────────────────────
document.getElementById('tickerInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') triggerSearch();
});
document.getElementById('searchBtn').addEventListener('click', triggerSearch);

function triggerSearch() {
  const val = document.getElementById('tickerInput').value.trim().toUpperCase();
  if (!val) return;
  runSearch(val);
}

// Parse "52.3M" / "1.2B" / "800K" → raw number
function parseVolStr(s) {
  if (!s) return 0;
  const n = parseFloat(s);
  if (isNaN(n)) return 0;
  const u = s.toUpperCase();
  if (u.includes('B')) return n * 1e9;
  if (u.includes('M')) return n * 1e6;
  if (u.includes('K')) return n * 1e3;
  return n;
}

async function runSearch(ticker) {
  ticker = ticker.toUpperCase().trim();
  document.getElementById('tickerInput').value = ticker;
  setError('');
  showResults();
  showLoading(`Analyzing ${ticker}…`);

  let data = null, extras = { fearGreed: null, earnings: [] };

  // Primary scan + Fear/Greed + Earnings — all in parallel
  try {
    const [scanRes, fgRes, earnRes] = await Promise.allSettled([
      fetch(`${BASE}/api/scan/${ticker}`),
      fetch(`${BASE}/api/fear-greed`),
      fetch(`${BASE}/api/earnings/upcoming`)
    ]);

    if (scanRes.status === 'rejected') throw new Error('Network error');
    const scanResp = scanRes.value;
    if (!scanResp.ok) throw new Error(`HTTP ${scanResp.status} from server`);
    data = await scanResp.json();
    if (data.error && !data.price) throw new Error(data.error);

    // Fear & Greed (best-effort)
    if (fgRes.status === 'fulfilled' && fgRes.value.ok) {
      try { extras.fearGreed = await fgRes.value.json(); } catch(_) {}
    }
    // Earnings calendar (best-effort)
    if (earnRes.status === 'fulfilled' && earnRes.value.ok) {
      try {
        const earningsList = await earnRes.value.json();
        // Find entries matching current ticker
        extras.earnings = (earningsList || []).filter(e =>
          (e.symbol || e.ticker || '').toUpperCase() === ticker
        );
      } catch(_) {}
    }
  } catch (fetchErr) {
    hideLoading();
    showSearch();
    setError(`Could not reach server: ${fetchErr.message}`);
    return;
  }

  hideLoading();

  // Debug: log key fields so we can see what signals are available
  const pd = data.priceData || {};
  console.log('[Predictor] scan data received:', {
    ticker: data.ticker,
    price: data.price,
    prediction: data.prediction,
    sentiment: data.sentiment,
    uptrendRatio: data.uptrendRatio,
    rsi_last: Array.isArray(pd.rsi) ? pd.rsi[pd.rsi.length-1] : pd.rsi,
    macd_last: Array.isArray(pd.macd_hist) ? pd.macd_hist[pd.macd_hist.length-1] : pd.macd_hist,
    sma20_last: Array.isArray(pd.sma20) ? pd.sma20[pd.sma20.length-1] : pd.sma20,
    sma50_last: Array.isArray(pd.sma50) ? pd.sma50[pd.sma50.length-1] : pd.sma50,
    vwap_last: Array.isArray(pd.vwap) ? pd.vwap[pd.vwap.length-1] : pd.vwap,
    chart_bars: Array.isArray(pd.prices) ? pd.prices.length : 0,
    fg: extras.fearGreed
  });

  try {
    populate(data, extras);
  } catch (renderErr) {
    console.error('[Predictor] Render error:', renderErr);
    setError(`Data loaded but display error: ${renderErr.message}`);
  }
}

// ── View transitions ──────────────────────────────────────────────────────────
function showResults() {
  document.getElementById('searchView').style.display  = 'none';
  document.getElementById('resultsView').style.display = 'block';
  document.getElementById('resultsBody').style.display = 'none';
}
function showSearch() {
  document.getElementById('resultsView').style.display = 'none';
  document.getElementById('searchView').style.display  = 'flex';
  document.getElementById('tickerInput').focus();
}
function showLoading(msg) {
  document.getElementById('loadingBar').style.display = 'block';
  document.getElementById('loadingText').textContent  = msg;
  document.getElementById('resultsBody').style.display = 'none';
}
function hideLoading() {
  document.getElementById('loadingBar').style.display  = 'none';
  document.getElementById('resultsBody').style.display = 'block';
}
function setError(msg) {
  const el = document.getElementById('searchError');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

// ── Probability engine ────────────────────────────────────────────────────────
function lastVal(arr) {
  if (!Array.isArray(arr)) return null;
  const filtered = arr.filter(x => x != null);
  return filtered.length ? filtered[filtered.length - 1] : null;
}

function computeProbabilities(d, extras) {
  extras = extras || {};
  const pd        = d.priceData || {};
  const rsi       = lastVal(Array.isArray(pd.rsi) ? pd.rsi : [pd.rsi]);
  const macdHist  = lastVal(pd.macd_hist);
  const price     = parseFloat(d.price) || 0;
  const sma20Last = lastVal(pd.sma20);
  const sma50Last = lastVal(pd.sma50);
  const bbUpper   = lastVal(pd.bb_upper);
  const bbLower   = lastVal(pd.bb_lower);
  const bbMiddle  = lastVal(pd.bb_middle);
  const vwapLast  = lastVal(pd.vwap);
  const sentiment = d.sentiment != null ? parseFloat(d.sentiment) : 0.5;
  const pred      = d.prediction || {};
  const breadth   = parseFloat(String(d.uptrendRatio || '')) || 50;
  const gapPct    = parseFloat(d.gapPct)       || 0;
  const gapDir    = d.gapDir || '';

  // ── Kronos GBM (biggest weight)
  let kronosAdj = 0;
  const kConf = pred.confidence || 0;
  if      (pred.signal === 'BULLISH') kronosAdj =  kConf * 0.40;
  else if (pred.signal === 'BEARISH') kronosAdj = -kConf * 0.40;

  // ── RSI
  let rsiAdj = 0;
  if (rsi != null) {
    if      (rsi < 30) rsiAdj =  18;
    else if (rsi < 40) rsiAdj =  10;
    else if (rsi < 50) rsiAdj =   4;
    else if (rsi < 60) rsiAdj =  -4;
    else if (rsi < 70) rsiAdj = -10;
    else               rsiAdj = -18;
  }

  // ── MACD histogram
  const macdAdj = macdHist != null ? (macdHist > 0 ? 8 : -8) : 0;

  // ── Social sentiment (±7)
  const sentAdj = (sentiment - 0.5) * 14;

  // ── Gap (intraday)
  const gapAdj = Math.abs(gapPct) > 1 ? (gapDir === 'up' ? 5 : -5) : 0;

  // ── Breadth
  let breadthAdj = 0;
  if      (breadth > 65) breadthAdj =  12;
  else if (breadth > 55) breadthAdj =   6;
  else if (breadth < 35) breadthAdj = -12;
  else if (breadth < 45) breadthAdj =  -6;

  // ── SMA position
  const sma20Adj = (sma20Last && price) ? (price > sma20Last ?  8 : -8) : 0;
  const sma50Adj = (sma50Last && price) ? (price > sma50Last ? 10 : -10) : 0;

  // ── Bollinger Bands
  let bbAdj = 0;
  if (bbUpper && bbLower && price) {
    if      (price > bbUpper) bbAdj = -8;
    else if (price < bbLower) bbAdj =  8;
    else if (bbMiddle)        bbAdj = price > bbMiddle ? 3 : -3;
  }

  // ── NEW: TTM Squeeze
  let sqzAdj = 0;
  const sqzOn    = pd.sqz_on;
  const sqzColor = String(pd.sqz_color || '').toLowerCase();
  if (sqzOn) {
    if      (sqzColor === 'green' || sqzColor.includes('green')) sqzAdj =  12;
    else if (sqzColor === 'red'   || sqzColor.includes('red'))   sqzAdj = -12;
  }
  // If squeeze NOT on but hist is positive, momentum building bullishly
  else if (pd.sqz_hist != null) {
    const sqzHist = lastVal(Array.isArray(pd.sqz_hist) ? pd.sqz_hist : [pd.sqz_hist]);
    if (sqzHist != null) sqzAdj = sqzHist > 0 ? 4 : -4;
  }

  // ── NEW: VWAP position
  let vwapAdj = 0;
  if (vwapLast && price) {
    vwapAdj = price > vwapLast ? 8 : -8;
  }

  // ── NEW: Volume Spike (direction-aware)
  let volAdj = 0;
  const volRaw  = parseVolStr(d.vol);
  const avgRaw  = parseVolStr(d.avgVol);
  const volRatio = avgRaw > 0 ? volRaw / avgRaw : 1;
  if (volRatio >= 2) {
    volAdj = d.dir === 'up' ? 8 : -8;
  } else if (volRatio >= 1.5) {
    volAdj = d.dir === 'up' ? 4 : -4;
  }

  // ── NEW: Fear & Greed (contrarian)
  let fgAdj = 0;
  const fg = extras.fearGreed;
  if (fg && fg.score != null) {
    const fgScore = parseFloat(fg.score);
    if      (fgScore <= 20) fgAdj =  10;  // extreme fear → contrarian buy
    else if (fgScore <= 35) fgAdj =   6;  // fear → slightly bullish
    else if (fgScore >= 80) fgAdj = -10;  // extreme greed → contrarian sell
    else if (fgScore >= 65) fgAdj =  -6;  // greed → slightly bearish
  }

  // ── NEW: Earnings proximity (uncertainty — caps max probability)
  let earningsNear = false, earningsDays = null;
  if (extras.earnings && extras.earnings.length > 0) {
    const nextDate = extras.earnings[0].date || extras.earnings[0].reportDate || '';
    if (nextDate) {
      const diff = Math.ceil((new Date(nextDate) - new Date()) / 86400000);
      if (diff >= 0 && diff <= 7) { earningsNear = true; earningsDays = diff; }
    }
  }

  // ── TODAY: Kronos + RSI + MACD + Gap + Squeeze + VWAP + Volume + FG
  const dayRaw  = 50 + kronosAdj + rsiAdj * 0.6 + macdAdj + gapAdj
                   + sqzAdj * 0.8 + vwapAdj * 0.7 + volAdj * 0.6
                   + sentAdj * 0.35 + fgAdj * 0.4;

  // ── THIS WEEK: Kronos medium + SMA20 + Breadth + Squeeze + FG
  const weekRaw = 50 + kronosAdj * 0.6 + rsiAdj * 0.4 + sma20Adj
                   + breadthAdj * 0.5 + sqzAdj * 0.6 + sentAdj * 0.3
                   + bbAdj * 0.5 + fgAdj * 0.5;

  // ── THIS MONTH: Breadth + SMA50 dominate, Kronos fades, FG matters
  const monthRaw = 50 + kronosAdj * 0.2 + sma20Adj * 0.3 + sma50Adj
                    + breadthAdj * 0.9 + sentAdj * 0.2 + fgAdj * 0.6;

  const clamp = v => Math.max(5, Math.min(95, Math.round(v)));

  // Earnings near → widen uncertainty (pull toward 50)
  const earnFactor = earningsNear ? 0.7 : 1.0;
  const pull = v => Math.round(50 + (v - 50) * earnFactor);

  return {
    day:   clamp(pull(clamp(dayRaw))),
    week:  clamp(pull(clamp(weekRaw))),
    month: clamp(pull(clamp(monthRaw))),
    kronosAdj, rsiAdj, macdAdj, sentAdj, breadthAdj, sma20Adj, sma50Adj,
    sqzAdj, vwapAdj, volAdj, fgAdj,
    rsi, macdHist, sma20Last, sma50Last, price, sentiment, breadth,
    sqzOn, sqzColor, vwapLast, volRatio,
    earningsNear, earningsDays,
    fg: fg || null
  };
}

function buildFactors(d, p) {
  const factors = [];
  const pred = d.prediction || {};

  // 1. Kronos AI
  if (pred.signal) {
    const dir = pred.signal === 'BULLISH' ? 1 : pred.signal === 'BEARISH' ? -1 : 0;
    factors.push({ dir, label: 'Kronos AI',
      desc: `${pred.signal} · ${pred.confidence || 0}% confidence` });
  }

  // 2. TTM Squeeze ──────────────────── NEW
  if (p.sqzOn != null) {
    if (p.sqzOn) {
      const dir  = p.sqzColor.includes('green') ? 1 : -1;
      const mood = p.sqzColor.includes('green') ? 'Firing bullish' : 'Firing bearish';
      factors.push({ dir, label: 'TTM Squeeze', desc: `${mood} — momentum expanding now` });
    } else {
      factors.push({ dir: 0, label: 'TTM Squeeze',
        desc: 'Squeeze building — coiled spring, watch for breakout' });
    }
  }

  // 3. VWAP Position ──────────────────── NEW
  if (p.vwapLast && p.price) {
    const dir  = p.price > p.vwapLast ? 1 : -1;
    const diff = Math.abs(((p.price - p.vwapLast) / p.vwapLast) * 100).toFixed(2);
    factors.push({ dir, label: 'VWAP',
      desc: `Price ${dir > 0 ? 'above' : 'below'} VWAP by ${diff}% — ${dir > 0 ? 'institutional buyers in control' : 'sellers in control'}` });
  }

  // 4. Volume Spike ──────────────────── NEW
  if (p.volRatio != null) {
    const vr  = p.volRatio;
    const dir = vr >= 1.5 ? (d.dir === 'up' ? 1 : -1) : 0;
    let desc;
    if      (vr >= 3)   desc = `${vr.toFixed(1)}× avg volume — heavy ${d.dir === 'up' ? 'buying' : 'selling'} pressure`;
    else if (vr >= 2)   desc = `${vr.toFixed(1)}× avg volume — elevated activity`;
    else if (vr >= 1.5) desc = `${vr.toFixed(1)}× avg volume — above normal`;
    else if (vr < 0.7)  desc = `${vr.toFixed(1)}× avg volume — thin market, low conviction`;
    else                desc = `${vr.toFixed(1)}× avg volume — normal activity`;
    factors.push({ dir, label: 'Volume', desc });
  }

  // 5. RSI
  if (p.rsi != null) {
    const r = parseFloat(p.rsi).toFixed(1);
    let dir = 0, desc;
    if      (p.rsi < 30) { dir =  1; desc = `RSI ${r} — Oversold, bounce likely`; }
    else if (p.rsi < 45) { dir =  1; desc = `RSI ${r} — Below midline, bullish lean`; }
    else if (p.rsi > 70) { dir = -1; desc = `RSI ${r} — Overbought, pullback risk`; }
    else if (p.rsi > 55) { dir = -1; desc = `RSI ${r} — Above midline, bearish lean`; }
    else                 { dir =  0; desc = `RSI ${r} — Neutral zone`; }
    factors.push({ dir, label: 'RSI', desc });
  }

  // 6. MACD
  if (p.macdHist != null) {
    const dir  = p.macdHist > 0 ? 1 : -1;
    factors.push({ dir, label: 'MACD',
      desc: p.macdHist > 0 ? 'Positive histogram — upward momentum' : 'Negative histogram — downward pressure' });
  }

  // 7. Fear & Greed ──────────────────── NEW
  if (p.fg && p.fg.score != null) {
    const score = parseFloat(p.fg.score);
    const zone  = p.fg.zone || p.fg.rating || '';
    let dir = 0, desc;
    if      (score <= 20) { dir =  1; desc = `${score} — Extreme Fear · contrarian buy signal`; }
    else if (score <= 35) { dir =  1; desc = `${score} — Fear · market oversold sentiment`; }
    else if (score >= 80) { dir = -1; desc = `${score} — Extreme Greed · contrarian caution`; }
    else if (score >= 65) { dir = -1; desc = `${score} — Greed · elevated risk appetite`; }
    else                  { dir =  0; desc = `${score} — Neutral (${zone})`; }
    factors.push({ dir, label: 'Fear & Greed', desc });
  }

  // 8. Social Sentiment
  {
    const pct   = Math.round(p.sentiment * 100);
    const dir   = pct > 60 ? 1 : pct < 40 ? -1 : 0;
    const total = (d.wsb || 0) + (d.st || 0) + (d.tw || 0);
    const note  = total > 0 ? ` · ${total.toLocaleString()} mentions` : '';
    factors.push({ dir, label: 'Social Sentiment', desc: `${pct}% bullish${note}` });
  }

  // 9. Market Breadth
  if (p.breadth != null) {
    const br  = parseFloat(p.breadth) || 50;
    const dir = br > 60 ? 1 : br < 40 ? -1 : 0;
    factors.push({ dir, label: 'Market Breadth',
      desc: `${br.toFixed(1)}% of market in uptrend` });
  }

  // 10. SMA20
  if (p.sma20Last && p.price) {
    const dir = p.price > p.sma20Last ? 1 : -1;
    const pct = Math.abs(((p.price - p.sma20Last) / p.sma20Last) * 100).toFixed(1);
    factors.push({ dir, label: '20-Day Avg',
      desc: `Price ${dir > 0 ? 'above' : 'below'} SMA20 by ${pct}%` });
  }

  // 11. SMA50
  if (p.sma50Last && p.price) {
    const dir = p.price > p.sma50Last ? 1 : -1;
    const pct = Math.abs(((p.price - p.sma50Last) / p.sma50Last) * 100).toFixed(1);
    factors.push({ dir, label: '50-Day Avg',
      desc: `Price ${dir > 0 ? 'above' : 'below'} SMA50 by ${pct}%` });
  }

  // 12. Earnings Proximity ──────────────────── NEW
  if (p.earningsNear) {
    factors.push({ dir: 0, label: '⚠ Earnings',
      desc: `Earnings in ${p.earningsDays === 0 ? 'today' : p.earningsDays + ' day' + (p.earningsDays === 1 ? '' : 's')} — predictions reduced, expect volatility` });
  }

  return factors;
}

// ── Render helpers ────────────────────────────────────────────────────────────
const CIRC = 2 * Math.PI * 54; // 339.3

function probColor(pct) {
  if (pct >= 60) return 'var(--bull)';
  if (pct <= 40) return 'var(--bear)';
  return 'var(--neutral)';
}
function probLabel(pct) {
  if (pct >= 60) return 'BULLISH';
  if (pct <= 40) return 'BEARISH';
  return 'NEUTRAL';
}
function setGauge(arcId, pctId, lblId, cardId, pct) {
  const arc   = document.getElementById(arcId);
  const pctEl = document.getElementById(pctId);
  const lblEl = document.getElementById(lblId);
  const card  = document.getElementById(cardId);
  const color = probColor(pct);
  const offset = CIRC * (1 - pct / 100);

  arc.style.stroke            = color;
  arc.style.strokeDashoffset  = offset;
  pctEl.textContent           = pct + '%';
  pctEl.style.color           = color;
  lblEl.textContent           = probLabel(pct);
  lblEl.style.color           = color;
  card.style.setProperty('--card-accent', color);
}

function safeToFixed(v, d) {
  const n = parseFloat(v);
  return isNaN(n) ? '—' : n.toFixed(d);
}

function populate(d, extras) {
  extras = extras || {};
  // ── Top bar
  try {
    document.getElementById('rTicker').textContent = d.ticker || '—';
    document.getElementById('rName').textContent   = d.name   || '';
    document.getElementById('rPrice').textContent  = d.price ? `$${d.price}` : '—';
    const chgEl = document.getElementById('rChg');
    chgEl.textContent = d.chgPct || '';
    chgEl.className   = 'price-chg ' + (d.dir === 'up' ? 'up' : 'dn');
  } catch(e) { console.warn('Header error', e); }

  // ── Probabilities — default covers every field buildFactors might access
  let p = {
    day: 50, week: 50, month: 50,
    rsi: null, macdHist: null,
    sma20Last: null, sma50Last: null,
    price: parseFloat(d.price) || 0,
    sentiment: parseFloat(d.sentiment) || 0.5,
    breadth: parseFloat(d.uptrendRatio) || 50,
    sqzOn: null, sqzColor: '', vwapLast: null,
    volRatio: 1, fg: null,
    earningsNear: false, earningsDays: null
  };
  try {
    p = computeProbabilities(d, extras);
  } catch(e) {
    console.warn('[Predictor] computeProbabilities error:', e.message, e);
  }
  // Always render gauges with whatever p we have
  try {
    setGauge('arcDay',   'pctDay',   'lblDay',   'cardDay',   p.day);
    setGauge('arcWeek',  'pctWeek',  'lblWeek',  'cardWeek',  p.week);
    setGauge('arcMonth', 'pctMonth', 'lblMonth', 'cardMonth', p.month);
    const pred = d.prediction || {};
    document.getElementById('drvDay').textContent   = pred.signal ? `Kronos: ${pred.signal} · ${pred.confidence || 0}% conf.` : '';
    document.getElementById('drvWeek').textContent  = d.breadthTag ? `Breadth: ${d.breadthTag}` : '';
    document.getElementById('drvMonth').textContent = d.trendDesc  || '';
  } catch(e) { console.warn('Gauge render error', e); }

  // ── Signal factors
  try {
    const factors = buildFactors(d, p);
    const dirIcon = { '1': '▲', '-1': '▼', '0': '─' };
    const dirCls  = { '1': 'bull', '-1': 'bear', '0': 'neut' };
    const dirClr  = { '1': 'var(--bull)', '-1': 'var(--bear)', '0': 'var(--neutral)' };
    document.getElementById('factorList').innerHTML = factors.map(f => {
      const k = String(f.dir);
      return `<div class="factor-row">
        <div class="factor-icon ${dirCls[k]||'neut'}" style="color:${dirClr[k]||'var(--neutral)'}">${dirIcon[k]||'─'}</div>
        <div class="factor-label">${f.label}</div>
        <div class="factor-desc">${f.desc}</div>
      </div>`;
    }).join('');
  } catch(e) { console.warn('Factors error', e); }

  // ── Confidence bars
  try {
    const pred = d.prediction || {};
    if (pred.socialScore != null || pred.momentumScore != null) {
      const bars = [
        { label: 'Social',   val: pred.socialScore   || 0, max: 35, color: 'var(--accent)' },
        { label: 'Momentum', val: pred.momentumScore || 0, max: 35, color: 'var(--bull)' },
      ];
      document.getElementById('confBars').innerHTML = bars.map(b => `
        <div class="conf-row">
          <div class="conf-label">${b.label}</div>
          <div class="conf-bar-bg"><div class="conf-bar-fill" style="width:${Math.round(b.val/b.max*100)}%;background:${b.color}"></div></div>
          <div style="font-size:12px;color:var(--muted);width:36px;text-align:right">${b.val}/${b.max}</div>
        </div>`).join('');
      document.getElementById('confCard').style.display = 'block';
    } else {
      document.getElementById('confCard').style.display = 'none';
    }
  } catch(e) { console.warn('Conf bars error', e); document.getElementById('confCard').style.display='none'; }

  // ── Key metrics
  try {
    const metrics = [
      { label: 'Price',   value: d.price   ? `$${d.price}` : '—' },
      { label: 'Volume',  value: d.vol      || '—' },
      { label: 'Avg Vol', value: d.avgVol   || '—' },
      { label: 'Mkt Cap', value: d.mktCap   || '—' },
      { label: 'RSI',     value: safeToFixed(p.rsi, 1) },
      { label: 'Breadth', value: d.uptrendRatio || '—' },
      { label: 'Trend',   value: d.trendVal || '—' },
      { label: 'Short %', value: d.shortVal || '—' },
    ];
    document.getElementById('metricsGrid').innerHTML = metrics.map(m => `
      <div class="metric-item">
        <div class="metric-label">${m.label}</div>
        <div class="metric-value">${m.value}</div>
      </div>`).join('');
  } catch(e) { console.warn('Metrics error', e); }

  // ── Company
  if (d.companyDesc) {
    const sentences = d.companyDesc.split('. ');
    const short = sentences.slice(0, 2).join('. ').trim();
    document.getElementById('companyDesc').textContent = short + (short.endsWith('.') ? '' : '.');
    const tags = [d.companySector, d.companyIndustry, d.companyExchange]
      .filter(Boolean)
      .map(t => `<span class="ctag">${t}</span>`).join('');
    document.getElementById('companyTags').innerHTML = tags;
    document.getElementById('companyCard').style.display = tags || short ? 'block' : 'none';
  } else {
    document.getElementById('companyCard').style.display = 'none';
  }
}

// Focus search on load
window.addEventListener('load', () => {
  document.getElementById('tickerInput').focus();
});
</script>
